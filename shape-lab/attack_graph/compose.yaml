name: bugcamp-attack-graph

services:
  neo4j:
    image: neo4j:2026.10.1
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    volumes:
      - neo4j_data:/data
    networks:
      - graph_net
    restart: unless-stopped

  api:
    image: bugcamp-attack-graph-api:dev
    build: .
    environment:
      <<: &graph_environment
        NEO4J_URI: bolt://neo4j:7687
        NEO4J_USER: neo4j
        NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
        GRAPH_SCAN_ID: bc1f19bf-7806-405d-a51d-85fce50bb5e6
      # Threat-model generation uses the Z.ai GLM Coding Plan DEV key. The
      # production ZAI_API_KEY is deliberately NOT referenced here: it is consumed
      # by another service. Keep this bound to ZAI_API_KEY_dev from the root .env.
      ZAI_API_KEY_dev: ${ZAI_API_KEY_dev:-}
      ZAI_CHAT_URL: ${ZAI_CHAT_URL:-https://api.z.ai/api/coding/paas/v4/chat/completions}
      ZAI_MODEL: ${ZAI_MODEL:-glm-5.3}
      # GLM-5.3 thinking is always on and shares the completion budget, so keep
      # max_tokens generous; reasoning_effort (low|high|max) trims the trace.
      ZAI_MAX_TOKENS: ${ZAI_MAX_TOKENS:-65536}
      ZAI_REASONING_EFFORT: ${ZAI_REASONING_EFFORT:-low}
      THREAT_MODEL_EXTERNAL_EXPORT_ALLOWED: ${THREAT_MODEL_EXTERNAL_EXPORT_ALLOWED:-false}
    volumes:
      - ../attack_graph_ui/dist:/app/ui:ro
    ports:
      - "127.0.0.1:8791:8791"
    depends_on:
      - neo4j
    networks:
      - graph_net
    restart: unless-stopped

  importer:
    image: bugcamp-attack-graph-api:dev
    build: .
    profiles: [import]
    user: "${GRAPH_IMPORT_UID:-1000}:${GRAPH_IMPORT_GID:-1000}"
    environment: *graph_environment
    command: ["python", "importer.py"]
    volumes:
      - ./snapshot.json:/data/graph.json:ro
      - ../BUGCAMP_CRAWL/bugcamp.io_443.sql:/data/bugcamp.io_443.sql:ro
    depends_on:
      - neo4j
    networks:
      - graph_net
    restart: "no"

volumes:
  neo4j_data:

networks:
  graph_net: {}
